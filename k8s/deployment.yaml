# ==============================================================================
# deployment.yaml — Manifiestos de Kubernetes para Tacos Las Cazuelitas
# Probado y compatible con clusters locales (kind / minikube) y EKS en AWS.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: taqueria
  labels:
    app.kubernetes.io/name: taqueria
    app.kubernetes.io/part-of: las-cazuelitas

---
# ── Configuración global no sensible ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: taqueria-config
  namespace: taqueria
data:
  ENV: "production"
  AWS_REGION: "us-east-1"
  QUEUE_BACKEND: "rabbitmq"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672/"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "taqueria"
  MINIO_ENDPOINT: "http://minio-service:9000"
  MINIO_BUCKET_RAW: "taqueria-raw"
  MINIO_BUCKET_CLEAN: "taqueria-clean"
  MODELOS_API_URL: "http://modelos-service:8001"

---
# ── Secretos de la aplicación (plantilla para producción) ───────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: taqueria-secrets
  namespace: taqueria
type: Opaque
stringData:
  POSTGRES_USER: "taqueria_user"
  POSTGRES_PASSWORD: "PasswordSeguro123!"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "miniopassword123"
  API_SECRET_KEY: "cazuelitas_jwt_super_secreto_key_2024"
  API_TOKEN: "token_ingesta_secreto_cazuelitas"

---
# ── Deployment: API de Pedidos (FastAPI) ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: taqueria
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: taqueria/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: taqueria-config
            - secretRef:
                name: taqueria-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: taqueria
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# ── Horizontal Pod Autoscaler (HPA) para API ──────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: taqueria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ── Deployment: Worker Asíncrono ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: taqueria
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: taqueria/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: taqueria-config
            - secretRef:
                name: taqueria-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ── Deployment: Servicio de Modelos ML (FastAPI) ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelos-deployment
  namespace: taqueria
  labels:
    app: modelos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelos
  template:
    metadata:
      labels:
        app: modelos
    spec:
      containers:
        - name: modelos
          image: taqueria/modelos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: taqueria-config
            - secretRef:
                name: taqueria-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: modelos-service
  namespace: taqueria
spec:
  type: ClusterIP
  selector:
    app: modelos
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001

---
# ── Deployment: Tablero Streamlit ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tablero-deployment
  namespace: taqueria
  labels:
    app: tablero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tablero
  template:
    metadata:
      labels:
        app: tablero
    spec:
      containers:
        - name: tablero
          image: taqueria/tablero:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: taqueria-config
            - secretRef:
                name: taqueria-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: tablero-service
  namespace: taqueria
spec:
  type: LoadBalancer
  selector:
    app: tablero
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
