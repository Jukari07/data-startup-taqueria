# =============================================================
# docker-compose.yml — Tacos Las Cazuelitas
# Orquesta todos los servicios del proyecto en local.
# Uso: docker-compose up --build
# Requiere: archivo .env configurado (cp .env.example .env)
#
# IMPORTANTE — Variables de red vs. variables locales:
#   El archivo .env.example usa localhost para desarrollo sin Docker.
#   Las variables de entorno definidas aquí dentro de cada servicio
#   SOBREESCRIBEN las del .env, apuntando a los nombres de servicio
#   internos de Docker (minio, rabbitmq, postgres) que sólo existen
#   dentro de la red docker-compose.
# =============================================================

services:

  # ── Base de datos relacional ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_USER:     ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Almacenamiento de objetos compatible con S3 (pgsty/silo) ─
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:?Configura MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Configura MINIO_SECRET_KEY en .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Broker de mensajes ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Interfaz web de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── API de pedidos (FastAPI) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/pedidos/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Sobrescribe localhost por nombres de servicio Docker internos:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Worker de procesamiento asíncrono ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Sobrescribe localhost por nombres de servicio Docker internos:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Servicio de modelos predictivos ──────────────────────────
  modelos:
    build:
      context: .
      dockerfile: services/modelos/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Tablero de analítica (Streamlit) ─────────────────────────
  tablero:
    build:
      context: .
      dockerfile: services/tablero/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Sobrescribe localhost por nombres de servicio Docker internos:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local
